name: Seed and build test configurations of the ODK

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/seed-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/seed-tests.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # We run the seeding tests using a "native" ODK environments;
        # those will never be supported on Windows, but they SHOULD work
        # on x86 GNU/Linux and both x86 and arm64 macOS.
        # However we do NOT routinely test on x64 macOS because GitHub
        # Actions runners for that platform are twice slower than the
        # the runners for arm64 macOS, and it is just not worth it.
        os: [ ubuntu-latest, macos-15 ]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Create dummy Git user name
        run: git config --global user.name Alice
      - name: Create dummy Git user email
        run: git config --global user.email alice@example.org
      - name: Install Python dependencies
        run: uv sync --all-extras
      - name: Run the tests
        run: cd tests && sh test-configs.sh
